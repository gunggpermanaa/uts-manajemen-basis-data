version: "3.9"

services:
  postgres_AgungPermana:
    image: postgres:15
    container_name: postgres_AgungPermana
    restart: unless-stopped
    env_file:
      - .env
    environment:
      POSTGRES_USER: ${POSTGRES_USER}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
      POSTGRES_DB: ${POSTGRES_DB}
    ports:
      - "${POSTGRES_PORT}:5432"

    volumes:
      - postgres_data_AgungPermana:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER} -d ${POSTGRES_DB}"]
      interval: 10s
      timeout: 5s
      retries: 5

  pgadmin_AgungPermana:
    image: dpage/pgadmin4:latest
    container_name: pgadmin_AgungPermana
    restart: unless-stopped
    env_file:
      - .env
    environment:
      PGADMIN_DEFAULT_EMAIL: ${PGADMIN_DEFAULT_EMAIL}
      PGADMIN_DEFAULT_PASSWORD: ${PGADMIN_DEFAULT_PASSWORD}
    ports:
      - "${PGADMIN_PORT}:80"
    depends_on:
      postgres_AgungPermana:
        condition: service_healthy
    volumes:
      - pgadmin_data_AgungPermana:/var/lib/pgadmin

volumes:
  postgres_data_AgungPermana:
  pgadmin_data_AgungPermana:
